name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Cyrius toolchain
        run: |
          set -e
          # The cyrius.cyml [package].cyrius pin is the single source of truth.
          #
          # Use the UPSTREAM installer, not a hand-rolled untar. Since cyrius
          # 6.5.24 every verb resolves the manifest pin against
          # $CYRIUS_HOME/versions/<pin>/lib and hard-errors if that path is
          # absent. The old recipe here flattened the tarball into
          # $HOME/.cyrius/{bin,lib} with no versions/ dir, so at the 6.5.35 pin
          # `cyrius build` dies with "pins version 6.5.35 but it is not
          # installed" before compiling anything. install.sh lays out
          # versions/<ver>/{bin,lib} + the `current` file, and verifies the
          # release SHA-256. Matches patra + abaco.
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Build
        # klug is agnos-first, so gate BOTH targets here rather than discovering
        # an --agnos break only at tag time in release.yml: the host build is
        # dev-host dogfooding (/dev/kmsg), the agnos build is the real reader
        # (klug#36) that gets staged onto the agnos-fs /bin.
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/klug
          cyrius build --agnos src/main.cyr build/klug_agnos

      - name: Test
        # Explicit .tcyr path (matches patra + the other AGNOS-tic tools).
        # `cyrius test tests` would also work — the directory form walks .tcyr
        # recursively, and it replaces the `cyrius tests` verb (deprecated at
        # 6.7.6, removed at 6.7.12) — but naming the file keeps the gate pinned
        # to the one suite this repo has.
        run: cyrius test tests/klug.tcyr

      - name: Smoke (execute the host binary)
        # `cyrius test` runs the lenses, the write loop and the emit path in-process.
        # This step is the only place the BINARY runs, and the only place the
        # /dev/kmsg READ runs at all. The contract:
        #   · --help: exit 0, usage on stdout.
        #   · an unknown option: exit 2, prose on stderr and NOTHING on stdout —
        #     fd 1 carries the dump, so error prose there would land inside
        #     `klug > f.txt` and be piped into `klug | grep`.
        #   · unprivileged: either the dump (exit 0) or the "kernel log
        #     unavailable" note (exit 1). Which one depends on the runner's
        #     kernel.dmesg_restrict, so both are accepted — but exit 1 must come
        #     with an EMPTY stdout.
        #   · as root (GitHub-hosted runners have passwordless sudo): a non-empty
        #     dump; every record `-w` emits carries syslog level <= 4 and every
        #     record `-e` emits level <= 3 (PRI is the field before the first
        #     comma; `PRI % 8` is the level). Continuation lines start with a
        #     space, inherit their record's level, and are skipped by the check.
        #     The assertion is on what is emitted, never on how much — plus
        #     -e ⊆ -w ⊆ full by line count. The three reads run back to back over
        #     the same log, and the filler below puts hundreds of info lines
        #     between the counts, so a runner logging in between cannot invert them.
        #   · ⛔ the 0.2.1 row — a log BIGGER than klug's 64 KB buffer comes out
        #     WHOLE. Through 0.2.0 the Linux reader stopped when its buffer filled,
        #     so the NEWEST records were dropped and klug exited 0. Write ~110 KB of
        #     user.info filler to /dev/kmsg (one open per line, so the per-open
        #     devkmsg ratelimit — 10 per 5 s — never bites), then three markers
        #     LAST: the full dump must be over 64 KB and carry all three, `-w` the
        #     warning and the err but not the info, `-e` only the err. Before 0.2.1
        #     the markers sit past the cut, and this row fails.
        #   · ⛔ the 0.3.1 row — klug RUNS with no /proc, and its flags still work.
        #     lib/args.cyr reads argv only from /proc/self/cmdline, so through 0.3.0
        #     every flag vanished with no /proc: `klug -e` dumped the whole log,
        #     `klug --help` dumped it too, and both exited 0. With /proc covered in a
        #     private mount namespace klug must read argv off the initial stack and
        #     behave exactly as it does above. `ulimit -n 3` is the same failure with
        #     no root: no free fd to open /proc/self/cmdline.
        #   · ⛔ the 0.3.2 rows — klug RUNS with no heap and with no /dev. alloc_init
        #     EXITS when its first mmap fails, so through 0.3.1 `ulimit -v` killed klug
        #     before it read a byte, with no log. And a missing /dev/kmsg was exit 1,
        #     no log: syslog(2) needs no /dev, no /proc and no free fd. With /dev covered
        #     too the dump must come from syslog(2), be over 64 KB (klug's own buffer)
        #     and filter correctly. `sudo ... ulimit -n 3` reaches the same arm with
        #     /dev still there, because /dev/kmsg cannot be opened either.
        run: |
          set -eu
          ./build/klug --help > help.txt
          test -s help.txt
          rc=0; ./build/klug --bogus > out.txt 2> err.txt || rc=$?
          test "$rc" = 2
          test ! -s out.txt
          test -s err.txt
          rc=0; ./build/klug > unpriv.txt 2> unpriv.err || rc=$?
          if [ "$rc" = 1 ]; then
            test ! -s unpriv.txt
            grep -q 'kernel log unavailable' unpriv.err
          else
            test "$rc" = 0
          fi
          pad='................................................................................................................................................'
          sudo sh -c 'i=0; while [ $i -lt 600 ]; do echo "<14>klug-ci filler $i $1" > /dev/kmsg || exit 1; i=$((i+1)); done' sh "$pad" \
            || { echo "::error::cannot write /dev/kmsg on this runner (printk.devkmsg=off?)"; exit 1; }
          sudo sh -c 'echo "<14>klug-ci marker info" > /dev/kmsg && echo "<12>klug-ci marker warning" > /dev/kmsg && echo "<11>klug-ci marker err" > /dev/kmsg'
          sudo ./build/klug > full.txt
          test -s full.txt
          sudo ./build/klug -w > warn.txt
          sudo ./build/klug -e > errs.txt
          awk -F, '/^ / { next } { if (($1 % 8) > 4) { print "not a warning: " $0; bad = 1 } } END { exit bad + 0 }' warn.txt
          awk -F, '/^ / { next } { if (($1 % 8) > 3) { print "not an error: " $0; bad = 1 } } END { exit bad + 0 }' errs.txt
          test "$(wc -l < errs.txt)" -le "$(wc -l < warn.txt)"
          test "$(wc -l < warn.txt)" -le "$(wc -l < full.txt)"
          test "$(wc -c < full.txt)" -gt 65536
          grep -q ';klug-ci marker info$' full.txt
          grep -q ';klug-ci marker warning$' full.txt
          grep -q ';klug-ci marker err$' full.txt
          grep -q ';klug-ci marker warning$' warn.txt
          grep -q ';klug-ci marker err$' warn.txt
          if grep -q ';klug-ci marker info$' warn.txt; then echo "-w leaked the info marker"; exit 1; fi
          grep -q ';klug-ci marker err$' errs.txt
          if grep -q ';klug-ci marker warning$' errs.txt; then echo "-e leaked the warning marker"; exit 1; fi
          (ulimit -n 3; ./build/klug --help) > nofd.txt
          cmp help.txt nofd.txt
          mkdir -p noproc
          sudo unshare -m sh -eu -c '
            mount --bind noproc /proc
            test ! -e /proc/self/cmdline
            ./build/klug > np_full.txt
            ./build/klug -w > np_warn.txt
            ./build/klug -e > np_errs.txt
            ./build/klug --help > np_help.txt
            rc=0; ./build/klug --bogus > np_out.txt 2> np_err.txt || rc=$?
            test "$rc" = 2
            test ! -s np_out.txt
            test -s np_err.txt
          '
          cmp help.txt np_help.txt
          grep -q ';klug-ci marker err$' np_full.txt
          grep -q ';klug-ci marker warning$' np_warn.txt
          grep -q ';klug-ci marker err$' np_errs.txt
          if grep -q ';klug-ci marker info$' np_warn.txt; then echo "-w was ignored with no /proc"; exit 1; fi
          if grep -q ';klug-ci marker warning$' np_errs.txt; then echo "-e was ignored with no /proc"; exit 1; fi
          (ulimit -v 8000; ./build/klug --help) > noheap.txt
          cmp help.txt noheap.txt
          sudo sh -c 'ulimit -v 8000; exec ./build/klug -e' > nh_errs.txt
          grep -q ';klug-ci marker err$' nh_errs.txt
          if grep -q ';klug-ci marker warning$' nh_errs.txt; then echo "-e was ignored with no heap"; exit 1; fi
          sudo unshare -m sh -eu -c '
            mount --bind noproc /proc
            mount --bind noproc /dev
            test ! -e /dev/kmsg
            ./build/klug > sl_full.txt 2> sl_full.err
            ./build/klug -w > sl_warn.txt 2> sl_warn.err
            ./build/klug -e > sl_errs.txt 2> sl_errs.err
          '
          grep -q 'syslog(2)' sl_full.err
          test "$(wc -c < sl_full.txt)" -gt 65536
          grep -q '^<14>.*klug-ci marker info$' sl_full.txt
          grep -q '^<12>.*klug-ci marker warning$' sl_warn.txt
          grep -q '^<11>.*klug-ci marker err$' sl_warn.txt
          grep -q '^<11>.*klug-ci marker err$' sl_errs.txt
          awk -F'[<>]' '{ if (($2 % 8) > 4) { print "not a warning: " $0; bad = 1 } } END { exit bad + 0 }' sl_warn.txt
          awk -F'[<>]' '{ if (($2 % 8) > 3) { print "not an error: " $0; bad = 1 } } END { exit bad + 0 }' sl_errs.txt
          sudo sh -c 'ulimit -n 3; exec ./build/klug -e' > sl_nofd.txt
          grep -q '^<11>.*klug-ci marker err$' sl_nofd.txt
          echo "smoke: full=$(wc -l < full.txt) lines / $(wc -c < full.txt) B, -w=$(wc -l < warn.txt), -e=$(wc -l < errs.txt)"
