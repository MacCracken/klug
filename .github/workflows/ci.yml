name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Cyrius toolchain
        run: |
          set -e
          # The cyrius.cyml [package].cyrius pin is the single source of truth.
          #
          # Use the UPSTREAM installer, not a hand-rolled untar. Since cyrius
          # 6.5.24 every verb resolves the manifest pin against
          # $CYRIUS_HOME/versions/<pin>/lib and hard-errors if that path is
          # absent. The old recipe here flattened the tarball into
          # $HOME/.cyrius/{bin,lib} with no versions/ dir, so at the 6.5.35 pin
          # `cyrius build` dies with "pins version 6.5.35 but it is not
          # installed" before compiling anything. install.sh lays out
          # versions/<ver>/{bin,lib} + the `current` file, and verifies the
          # release SHA-256. Matches patra + abaco.
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Build
        # klug is agnos-first, so gate BOTH targets here rather than discovering
        # an --agnos break only at tag time in release.yml: the host build is
        # dev-host dogfooding (/dev/kmsg), the agnos build is the real reader
        # (klug#36) that gets staged onto the agnos-fs /bin.
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/klug
          cyrius build --agnos src/main.cyr build/klug_agnos

      - name: Test
        # Explicit .tcyr path (matches patra + the other AGNOS-tic tools).
        # `cyrius tests` would also work at this pin — it discovers .tcyr under
        # tests/ recursively since 6.4.72 — but naming the file keeps the gate
        # pinned to the one suite this repo has.
        run: cyrius test tests/klug.tcyr

      - name: Smoke (execute the host binary)
        # `cyrius test` runs the lenses, the write loop and the emit path in-process.
        # This step is the only place the BINARY runs, and the only place the
        # /dev/kmsg READ runs at all. The contract:
        #   · --help: exit 0, usage on stdout.
        #   · an unknown option: exit 2, prose on stderr and NOTHING on stdout —
        #     fd 1 carries the dump, so error prose there would land inside
        #     `klug > f.txt` and be piped into `klug | grep`.
        #   · unprivileged: either the dump (exit 0) or the "kernel log
        #     unavailable" note (exit 1). Which one depends on the runner's
        #     kernel.dmesg_restrict, so both are accepted — but exit 1 must come
        #     with an EMPTY stdout.
        #   · as root (GitHub-hosted runners have passwordless sudo): a non-empty
        #     dump; every record `-w` emits carries syslog level <= 4 and every
        #     record `-e` emits level <= 3 (PRI is the field before the first
        #     comma; `PRI % 8` is the level). Continuation lines start with a
        #     space, inherit their record's level, and are skipped by the check.
        #     `-e` may legitimately be EMPTY on a clean boot, so the assertion is
        #     on what is emitted, never on how much — plus -e ⊆ -w ⊆ full by
        #     line count, which holds because all three reads cover the same
        #     first 64 KB of records.
        run: |
          set -eu
          ./build/klug --help > help.txt
          test -s help.txt
          rc=0; ./build/klug --bogus > out.txt 2> err.txt || rc=$?
          test "$rc" = 2
          test ! -s out.txt
          test -s err.txt
          rc=0; ./build/klug > unpriv.txt 2> unpriv.err || rc=$?
          if [ "$rc" = 1 ]; then
            test ! -s unpriv.txt
            grep -q 'kernel log unavailable' unpriv.err
          else
            test "$rc" = 0
          fi
          sudo ./build/klug > full.txt
          test -s full.txt
          sudo ./build/klug -w > warn.txt
          sudo ./build/klug -e > errs.txt
          awk -F, '/^ / { next } { if (($1 % 8) > 4) { print "not a warning: " $0; bad = 1 } } END { exit bad + 0 }' warn.txt
          awk -F, '/^ / { next } { if (($1 % 8) > 3) { print "not an error: " $0; bad = 1 } } END { exit bad + 0 }' errs.txt
          test "$(wc -l < errs.txt)" -le "$(wc -l < warn.txt)"
          test "$(wc -l < warn.txt)" -le "$(wc -l < full.txt)"
          echo "smoke: full=$(wc -l < full.txt) lines, -w=$(wc -l < warn.txt), -e=$(wc -l < errs.txt)"
