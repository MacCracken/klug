name: Release

on:
  push:
    tags: ['[0-9]*']

permissions:
  contents: write

jobs:
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  release:
    name: Build & Release
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify version
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          TAG_VERSION="${GITHUB_REF_NAME}"
          test "$FILE_VERSION" = "$TAG_VERSION" || { echo "VERSION ($FILE_VERSION) != tag ($TAG_VERSION)"; exit 1; }

      - name: Install Cyrius toolchain
        run: |
          set -e
          # Keep in lockstep with ci.yml — see the rationale there. Short form:
          # cyrius 6.5.24+ resolves the manifest pin against
          # $CYRIUS_HOME/versions/<pin>/lib, which the old flattened untar never
          # created, so the upstream installer is now mandatory.
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Build
        # klug is agnos-first: ship both the host build (Linux, /dev/kmsg
        # dogfooding) and the CYRIUS_TARGET_AGNOS build (klug#36, the native
        # reader staged onto the agnos-fs /bin).
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/klug
          cyrius build --agnos src/main.cyr build/klug_agnos

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build/*
